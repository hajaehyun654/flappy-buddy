<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Buddy - 귀여운 버디의 비행</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #1a1a2e;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 420px;
      height: 640px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 4px #4e54c8;
      border-radius: 16px;
      overflow: hidden;
      background: #4fc3f7;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-button {
      position: absolute;
      top: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #333;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.1s, background 0.2s;
      z-index: 10;
    }
    .hud-button:active {
      transform: scale(0.92);
    }
    #pause-btn { right: 66px; }
    #sound-btn { right: 16px; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="420" height="640"></canvas>
  <button id="pause-btn" class="hud-button" title="일시정지 (P)">❚❚</button>
  <button id="sound-btn" class="hud-button" title="소리 On/Off (M)">🔊</button>
</div>

<script>
/**
 * Flappy Buddy - Core Engine & Physics
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GAME_WIDTH = 420;
const GAME_HEIGHT = 640;
const GROUND_Y = 560;

// Game states
const STATE = {
  READY: 0,
  PLAYING: 1,
  GAMEOVER: 2
};

let gameState = STATE.READY;
let frames = 0;
let soundEnabled = true;
let isPaused = false;

// Buddy Player
const buddy = {
  x: 90,
  y: 280,
  radius: 18,
  velocity: 0,
  gravity: 0.32,
  jumpStrength: -6.5,
  rotation: 0,
  wingAngle: 0,

  reset() {
    this.x = 90;
    this.y = 280;
    this.velocity = 0;
    this.rotation = 0;
    this.wingAngle = 0;
  },

  flap() {
    this.velocity = this.jumpStrength;
  },

  update() {
    // Bobbing animation in READY state
    if (gameState === STATE.READY) {
      this.y = 280 + Math.sin(frames * 0.08) * 8;
      this.rotation = 0;
      this.wingAngle = Math.sin(frames * 0.2) * 0.5;
      return;
    }

    // Physics in PLAYING state
    this.velocity += this.gravity;
    this.y += this.velocity;

    // Wing flapping
    this.wingAngle = Math.sin(frames * 0.35);

    // Rotation based on velocity
    if (this.velocity < 0) {
      this.rotation = Math.max(-0.45, this.velocity * 0.07);
    } else {
      this.rotation = Math.min(Math.PI / 2.2, this.rotation + 0.045);
    }

    // Ground collision
    if (this.y + this.radius >= GROUND_Y) {
      this.y = GROUND_Y - this.radius;
      gameState = STATE.GAMEOVER;
    }

    // Ceiling clamp
    if (this.y - this.radius <= 0) {
      this.y = this.radius;
      this.velocity = 0;
    }
  },

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    // Shadow underneath
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.beginPath();
    ctx.ellipse(2, this.radius + 6, this.radius * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const bodyGrad = ctx.createRadialGradient(-4, -4, 4, 0, 0, this.radius);
    bodyGrad.addColorStop(0, '#FFF59D');
    bodyGrad.addColorStop(0.6, '#FBC02D');
    bodyGrad.addColorStop(1, '#F57F17');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#D84315';
    ctx.stroke();

    // Cheerful blush
    ctx.fillStyle = 'rgba(255, 112, 67, 0.5)';
    ctx.beginPath();
    ctx.arc(2, 6, 6, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(8, -5, 6.5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Pupil & Glint
    ctx.fillStyle = '#1e272c';
    ctx.beginPath();
    ctx.arc(10, -5, 3.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(8.5, -7, 1.3, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#FF7043';
    ctx.beginPath();
    ctx.moveTo(14, -2);
    ctx.lineTo(26, 3);
    ctx.lineTo(13, 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#D84315';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wing
    ctx.save();
    ctx.translate(-8, 3);
    ctx.rotate(this.wingAngle);
    ctx.fillStyle = '#FFF176';
    ctx.strokeStyle = '#F57F17';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
};

// Background Environment
let bgOffset = 0;
let groundOffset = 0;

function drawBackground() {
  // Sky Gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#4fc3f7');
  sky.addColorStop(0.7, '#b3e5fc');
  sky.addColorStop(1, '#e1f5fe');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, GAME_WIDTH, GROUND_Y);

  // Distant clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  const cloudX1 = ((frames * 0.4) % (GAME_WIDTH + 160)) - 80;
  drawCloud(GAME_WIDTH - cloudX1, 100, 45);
  const cloudX2 = ((frames * 0.25 + 200) % (GAME_WIDTH + 200)) - 100;
  drawCloud(GAME_WIDTH - cloudX2, 170, 35);

  // Distant City / Hills Silhouettes
  ctx.fillStyle = '#81c784';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= GAME_WIDTH; x += 40) {
    const hillY = GROUND_Y - 50 + Math.sin((x + frames * 0.3) * 0.02) * 16;
    ctx.lineTo(x, hillY);
  }
  ctx.lineTo(GAME_WIDTH, GROUND_Y);
  ctx.closePath();
  ctx.fill();

  // Foreground rolling green hills
  ctx.fillStyle = '#66bb6a';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= GAME_WIDTH; x += 30) {
    const hillY = GROUND_Y - 26 + Math.sin((x + frames * 0.6) * 0.035) * 12;
    ctx.lineTo(x, hillY);
  }
  ctx.lineTo(GAME_WIDTH, GROUND_Y);
  ctx.closePath();
  ctx.fill();
}

function drawCloud(cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.6, cy - r * 0.3, r * 0.75, 0, Math.PI * 2);
  ctx.arc(cx - r * 0.6, cy - r * 0.2, r * 0.65, 0, Math.PI * 2);
  ctx.arc(cx + r * 1.1, cy + r * 0.1, r * 0.55, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  if (gameState !== STATE.GAMEOVER) {
    groundOffset = (groundOffset + 2.4) % 24;
  }

  // Base ground body
  ctx.fillStyle = '#dcedc8';
  ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

  // Dirt soil
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(0, GROUND_Y + 16, GAME_WIDTH, GAME_HEIGHT - GROUND_Y - 16);

  // Top lush grass strip
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 16);

  // Moving grass blades pattern
  ctx.fillStyle = '#558b2f';
  ctx.beginPath();
  for (let x = -24; x < GAME_WIDTH + 24; x += 16) {
    const px = x - groundOffset;
    ctx.moveTo(px, GROUND_Y + 16);
    ctx.lineTo(px + 8, GROUND_Y + 4);
    ctx.lineTo(px + 16, GROUND_Y + 16);
  }
  ctx.fill();
}

// Audio Synthesizer (Zero external assets needed!)
class SoundEffects {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playJump() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(380, now);
      osc.frequency.exponentialRampToValueAtTime(760, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch(e) {}
  }

  playScore() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [1046.5, 1318.5].forEach((freq, i) => { // C6, E6
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.3, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.22);
      });
    } catch(e) {}
  }

  playHit() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch(e) {}
  }

  playClick() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } catch(e) {}
  }
}

const sfx = new SoundEffects();

// Pipes Obstacle Manager
const pipes = {
  items: [],
  width: 66,
  gap: 138,
  speed: 2.4,
  spawnInterval: 105,

  reset() {
    this.items = [];
  },

  update() {
    if (gameState !== STATE.PLAYING) return;

    // Spawn pipes
    if (frames % this.spawnInterval === 0) {
      const minPipeHeight = 60;
      const maxPipeHeight = GROUND_Y - this.gap - minPipeHeight;
      const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
      this.items.push({
        x: GAME_WIDTH,
        top: topHeight,
        bottom: GROUND_Y - (topHeight + this.gap),
        passed: false
      });
    }

    // Move & collide
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.x -= this.speed;

      // Score check
      if (!p.passed && p.x + this.width < buddy.x) {
        p.passed = true;
        score++;
        sfx.playScore();
      }

      // Precise collision with top pipe
      if (this.checkCollision(buddy, p.x, 0, this.width, p.top)) {
        triggerGameOver();
        return;
      }

      // Collision with bottom pipe
      const bottomY = GROUND_Y - p.bottom;
      if (this.checkCollision(buddy, p.x, bottomY, this.width, p.bottom)) {
        triggerGameOver();
        return;
      }

      // Remove off-screen pipes
      if (p.x + this.width < -10) {
        this.items.splice(i, 1);
      }
    }
  },

  checkCollision(circle, rx, ry, rw, rh) {
    // Slightly smaller hitbox for forgiving & fun gameplay
    const effectiveRadius = circle.radius - 3;
    const closestX = Math.max(rx, Math.min(circle.x, rx + rw));
    const closestY = Math.max(ry, Math.min(circle.y, ry + rh));
    const distanceX = circle.x - closestX;
    const distanceY = circle.y - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (effectiveRadius * effectiveRadius);
  },

  draw() {
    this.items.forEach(p => {
      // Top Pipe
      this.drawPipeSegment(p.x, 0, this.width, p.top, true);

      // Bottom Pipe
      const bottomY = GROUND_Y - p.bottom;
      this.drawPipeSegment(p.x, bottomY, this.width, p.bottom, false);
    });
  },

  drawPipeSegment(x, y, w, h, isTop) {
    // Main pipe body gradient
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#388e3c');
    grad.addColorStop(0.2, '#66bb6a');
    grad.addColorStop(0.45, '#a5d6a7');
    grad.addColorStop(0.7, '#43a047');
    grad.addColorStop(1, '#1b5e20');

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);

    // Pipe Cap (Rim)
    const capHeight = 24;
    const capExtra = 6;
    const capX = x - capExtra / 2;
    const capW = w + capExtra;
    const capY = isTop ? y + h - capHeight : y;

    const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    capGrad.addColorStop(0, '#2e7d32');
    capGrad.addColorStop(0.2, '#81c784');
    capGrad.addColorStop(0.45, '#c8e6c9');
    capGrad.addColorStop(0.75, '#388e3c');
    capGrad.addColorStop(1, '#1b5e20');

    ctx.fillStyle = capGrad;
    ctx.fillRect(capX, capY, capW, capHeight);
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(capX, capY, capW, capHeight);

    // Inner lip shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    if (isTop) {
      ctx.fillRect(capX, capY + capHeight - 4, capW, 4);
    } else {
      ctx.fillRect(capX, capY, capW, 4);
    }
  }
};

let score = 0;
let bestScore = parseInt(localStorage.getItem('flappy_buddy_best') || '0', 10);

function triggerGameOver() {
  if (gameState === STATE.GAMEOVER) return;
  gameState = STATE.GAMEOVER;
  sfx.playHit();
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flappy_buddy_best', bestScore);
  }
}

// Basic Loop
function gameLoop() {
  if (!isPaused) {
    frames++;
    buddy.update();
    pipes.update();
  }

  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  drawBackground();
  pipes.draw();
  buddy.draw();
  drawGround();

  requestAnimationFrame(gameLoop);
}

// Start loop
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
