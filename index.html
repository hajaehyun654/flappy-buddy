<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Buddy 🐥</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #0f172a;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 420px;
      height: 640px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 4px #3b82f6;
      border-radius: 20px;
      overflow: hidden;
      background: #38bdf8;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .hud-button {
      position: absolute;
      top: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #1e293b;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: transform 0.1s, background 0.2s;
      z-index: 20;
    }
    .hud-button:hover {
      background: #ffffff;
      transform: scale(1.05);
    }
    .hud-button:active {
      transform: scale(0.92);
    }
    #theme-btn { right: 120px; }
    #pause-btn { right: 68px; }
    #sound-btn { right: 16px; }

    /* UI Overlay Over Canvas */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 15;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border-radius: 24px;
      padding: 24px 28px;
      width: 86%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35), 0 0 0 3px #0284c7;
      pointer-events: auto;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.75) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 0;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      text-decoration: none;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .hidden {
      display: none !important;
    }
    .score-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 16px;
      margin: 14px 0;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-item span {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .score-item strong {
      font-size: 28px;
      color: #0f172a;
      font-weight: 800;
    }
    .medal-box {
      margin-bottom: 8px;
      font-size: 38px;
      line-height: 1;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="420" height="640"></canvas>
  <button id="theme-btn" class="hud-button" title="낮/밤 모드 전환 (N)">☀️</button>
  <button id="pause-btn" class="hud-button" title="일시정지 (P)">❚❚</button>
  <button id="sound-btn" class="hud-button" title="소리 On/Off (M)">🔊</button>

  <!-- Ready Overlay -->
  <div id="readyOverlay" class="overlay">
    <div style="text-align: center; pointer-events: none; margin-top: 140px;">
      <h1 style="font-size: 38px; font-weight: 900; text-shadow: 0 4px 12px rgba(0,0,0,0.3); color: #fff; margin-bottom: 8px;">
        FLAPPY BUDDY
      </h1>
      <p style="font-size: 16px; color: #f8fafc; font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,0.4);">
        화면을 탭하거나 스페이스바를 눌러 비행하세요!
      </p>
      <div style="margin-top: 16px; display: inline-block; background: rgba(0,0,0,0.35); padding: 8px 18px; border-radius: 20px; font-size: 13px;">
        🕹️ Space / ↑ / 터치 / 클릭
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="card">
      <h2 style="font-size: 24px; font-weight: 800; color: #e11d48; margin-bottom: 6px;">GAME OVER</h2>
      <div id="medalBox" class="medal-box">🥉</div>
      <div id="medalTitle" style="font-size: 14px; font-weight: 700; color: #64748b; margin-bottom: 8px;">브론즈 메달</div>
      
      <div class="score-board">
        <div class="score-item">
          <span>SCORE</span>
          <strong id="finalScore">0</strong>
        </div>
        <div class="score-item">
          <span>BEST</span>
          <strong id="bestScoreText">0</strong>
        </div>
      </div>

      <button id="restartBtn" class="btn btn-primary">
        🔄 다시 도전하기
      </button>
      <button id="downloadBtn" class="btn btn-secondary" title="이 게임을 단독 HTML 파일로 다운로드합니다">
        📥 게임 파일 다운로드 (.html)
      </button>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="overlay hidden">
    <div class="card" style="width: 70%;">
      <h2 style="font-size: 22px; font-weight: 800; color: #3b82f6; margin-bottom: 12px;">일시정지 ⏸️</h2>
      <p style="font-size: 14px; color: #64748b; margin-bottom: 16px;">잠시 쉬어가는 시간!</p>
      <button id="resumeBtn" class="btn btn-primary">▶️ 계속하기</button>
    </div>
  </div>
</div>

<script>
/**
 * Flappy Buddy - Complete Standalone Web Game
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const readyOverlay = document.getElementById('readyOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreTextEl = document.getElementById('bestScoreText');
const medalBoxEl = document.getElementById('medalBox');
const medalTitleEl = document.getElementById('medalTitle');
const themeBtn = document.getElementById('theme-btn');
const pauseBtn = document.getElementById('pause-btn');
const soundBtn = document.getElementById('sound-btn');
const restartBtn = document.getElementById('restartBtn');
const resumeBtn = document.getElementById('resumeBtn');
const downloadBtn = document.getElementById('downloadBtn');

const GAME_WIDTH = 420;
const GAME_HEIGHT = 640;
const GROUND_Y = 560;

const STATE = {
  READY: 0,
  PLAYING: 1,
  GAMEOVER: 2
};

let gameState = STATE.READY;
let frames = 0;
let score = 0;
let bestScore = parseInt(localStorage.getItem('flappy_buddy_best') || '0', 10);
let soundEnabled = true;
let isPaused = false;
let isNightMode = false;

// Precomputed twinkling stars for night mode
const stars = [];
for (let i = 0; i < 48; i++) {
  stars.push({
    x: Math.random() * GAME_WIDTH,
    y: Math.random() * (GROUND_Y - 80),
    radius: Math.random() * 1.6 + 0.6,
    twinkleSpeed: Math.random() * 0.05 + 0.02,
    phase: Math.random() * Math.PI * 2
  });
}

// Audio Synthesizer (Web Audio API - 100% self-contained)
class SoundEffects {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playJump() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(360, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.12);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } catch(e) {}
  }

  playScore() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [1046.5, 1318.5].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.07);
        gain.gain.setValueAtTime(0.25, now + i * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.07);
        osc.stop(now + i * 0.07 + 0.2);
      });
    } catch(e) {}
  }

  playHit() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.26);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.26);
    } catch(e) {}
  }

  playClick() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(540, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } catch(e) {}
  }

  playTransform() {
    if (!soundEnabled || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.26, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.06);
        osc.stop(now + i * 0.06 + 0.25);
      });
    } catch(e) {}
  }
}

const sfx = new SoundEffects();

// Buddy Color Palettes (Score progression rewards)
const BUDDY_PALETTES = [
  {
    name: '클래식 옐로우',
    body: ['#FFF9C4', '#FBC02D', '#F57F17'],
    stroke: '#BF360C',
    wing: '#FFF59D',
    wingStroke: '#F57F17',
    particle: '#FBC02D'
  },
  {
    name: '사쿠라 핑크',
    body: ['#FCE4EC', '#F06292', '#C2185B'],
    stroke: '#880E4F',
    wing: '#F8BBD0',
    wingStroke: '#AD1457',
    particle: '#F06292'
  },
  {
    name: '오션 시안',
    body: ['#E0F7FA', '#26C6DA', '#0097A7'],
    stroke: '#006064',
    wing: '#B2EBF2',
    wingStroke: '#00838F',
    particle: '#26C6DA'
  },
  {
    name: '미스틱 바이올렛',
    body: ['#EDE7F6', '#AB47BC', '#6A1B9A'],
    stroke: '#4A148C',
    wing: '#D1C4E9',
    wingStroke: '#7B1FA2',
    particle: '#AB47BC'
  },
  {
    name: '선셋 오렌지',
    body: ['#FFF3E0', '#FF7043', '#E64A19'],
    stroke: '#BF360C',
    wing: '#FFE0B2',
    wingStroke: '#D84315',
    particle: '#FF7043'
  },
  {
    name: '에메랄드 그린',
    body: ['#F1F8E9', '#7CB342', '#33691E'],
    stroke: '#1B5E20',
    wing: '#DCEDC8',
    wingStroke: '#558B2F',
    particle: '#7CB342'
  },
  {
    name: '네온 코발트',
    body: ['#E3F2FD', '#42A5F5', '#1565C0'],
    stroke: '#0D47A1',
    wing: '#BBDEFB',
    wingStroke: '#1976D2',
    particle: '#42A5F5'
  },
  {
    name: '루비 레드',
    body: ['#FFEBEE', '#EF5350', '#C62828'],
    stroke: '#7F0000',
    wing: '#FFCDD2',
    wingStroke: '#B71C1C',
    particle: '#EF5350'
  }
];

// Particle System
const particles = {
  items: [],
  spawn(x, y, count = 8, color = '#ffd54f') {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      this.items.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        size: Math.random() * 4 + 2,
        color,
        alpha: 1,
        decay: Math.random() * 0.03 + 0.02
      });
    }
  },
  update() {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08; // subtle gravity
      p.alpha -= p.decay;
      if (p.alpha <= 0) {
        this.items.splice(i, 1);
      }
    }
  },
  draw() {
    this.items.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
};

// Buddy Player
const buddy = {
  x: 95,
  y: 280,
  radius: 17,
  velocity: 0,
  gravity: 0.32,
  jumpStrength: -6.4,
  rotation: 0,
  wingAngle: 0,
  paletteIndex: 0,

  reset() {
    this.x = 95;
    this.y = 280;
    this.velocity = 0;
    this.rotation = 0;
    this.wingAngle = 0;
    this.paletteIndex = 0;
  },

  changeRandomColor() {
    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * BUDDY_PALETTES.length);
    } while (nextIndex === this.paletteIndex && BUDDY_PALETTES.length > 1);
    this.paletteIndex = nextIndex;

    const pal = BUDDY_PALETTES[this.paletteIndex];
    // Sparkle fireworks effect on transform
    particles.spawn(this.x, this.y, 20, pal.particle);
    sfx.playTransform();
  },

  flap() {
    sfx.init();
    this.velocity = this.jumpStrength;
    sfx.playJump();
    const pal = BUDDY_PALETTES[this.paletteIndex] || BUDDY_PALETTES[0];
    particles.spawn(this.x - 12, this.y + 10, 4, pal.body[0]);
  },

  update() {
    if (gameState === STATE.READY) {
      this.y = 280 + Math.sin(frames * 0.08) * 8;
      this.rotation = 0;
      this.wingAngle = Math.sin(frames * 0.2) * 0.4;
      return;
    }

    this.velocity += this.gravity;
    this.y += this.velocity;
    this.wingAngle = Math.sin(frames * 0.35);

    if (this.velocity < 0) {
      this.rotation = Math.max(-0.45, this.velocity * 0.07);
    } else {
      this.rotation = Math.min(Math.PI / 2.2, this.rotation + 0.048);
    }

    // Ground hit
    if (this.y + this.radius >= GROUND_Y) {
      this.y = GROUND_Y - this.radius;
      triggerGameOver();
    }

    // Ceiling clamp
    if (this.y - this.radius <= 0) {
      this.y = this.radius;
      this.velocity = 0;
    }
  },

  draw() {
    const pal = BUDDY_PALETTES[this.paletteIndex] || BUDDY_PALETTES[0];

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    // Dynamic shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.beginPath();
    ctx.ellipse(2, this.radius + 6, this.radius * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body Gradient using active palette
    const bodyGrad = ctx.createRadialGradient(-4, -4, 4, 0, 0, this.radius);
    bodyGrad.addColorStop(0, pal.body[0]);
    bodyGrad.addColorStop(0.55, pal.body[1]);
    bodyGrad.addColorStop(1, pal.body[2]);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = pal.stroke;
    ctx.stroke();

    // Cheerful blush
    ctx.fillStyle = 'rgba(255, 112, 67, 0.55)';
    ctx.beginPath();
    ctx.arc(3, 5, 5.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(8, -5, 6, 7.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Pupil & Reflection
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(9.8, -5, 3.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(8.5, -6.8, 1.3, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#FF7043';
    ctx.beginPath();
    ctx.moveTo(13, -2);
    ctx.lineTo(25, 2.5);
    ctx.lineTo(12, 7.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = pal.stroke;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Wing using active palette
    ctx.save();
    ctx.translate(-8, 3);
    ctx.rotate(this.wingAngle);
    ctx.fillStyle = pal.wing;
    ctx.strokeStyle = pal.wingStroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6.5, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
};

// Pipe Manager
const pipes = {
  items: [],
  width: 68,
  gap: 140,
  speed: 2.35,
  spawnInterval: 110,

  reset() {
    this.items = [];
  },

  update() {
    if (gameState !== STATE.PLAYING) return;

    if (frames % this.spawnInterval === 0) {
      const minPipeHeight = 65;
      const maxPipeHeight = GROUND_Y - this.gap - minPipeHeight;
      const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
      this.items.push({
        x: GAME_WIDTH,
        top: topHeight,
        bottom: GROUND_Y - (topHeight + this.gap),
        passed: false
      });
    }

    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.x -= this.speed;

      if (!p.passed && p.x + this.width < buddy.x) {
        p.passed = true;
        score++;
        sfx.playScore();
        particles.spawn(buddy.x + 10, buddy.y, 10, '#facc15');

        // 5점, 10점 등 점수가 5씩 바뀔 때마다 랜덤 색상으로 변신
        if (score > 0 && score % 5 === 0) {
          buddy.changeRandomColor();
        }
      }

      if (this.checkCollision(buddy, p.x, 0, this.width, p.top)) {
        triggerGameOver();
        return;
      }

      const bottomY = GROUND_Y - p.bottom;
      if (this.checkCollision(buddy, p.x, bottomY, this.width, p.bottom)) {
        triggerGameOver();
        return;
      }

      if (p.x + this.width < -12) {
        this.items.splice(i, 1);
      }
    }
  },

  checkCollision(circle, rx, ry, rw, rh) {
    const effectiveRadius = circle.radius - 3.5;
    const closestX = Math.max(rx, Math.min(circle.x, rx + rw));
    const closestY = Math.max(ry, Math.min(circle.y, ry + rh));
    const distanceX = circle.x - closestX;
    const distanceY = circle.y - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (effectiveRadius * effectiveRadius);
  },

  draw() {
    this.items.forEach(p => {
      this.drawPipeSegment(p.x, 0, this.width, p.top, true);
      const bottomY = GROUND_Y - p.bottom;
      this.drawPipeSegment(p.x, bottomY, this.width, p.bottom, false);
    });
  },

  drawPipeSegment(x, y, w, h, isTop) {
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#2e7d32');
    grad.addColorStop(0.2, '#66bb6a');
    grad.addColorStop(0.48, '#a5d6a7');
    grad.addColorStop(0.78, '#43a047');
    grad.addColorStop(1, '#1b5e20');

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);

    const capHeight = 25;
    const capExtra = 8;
    const capX = x - capExtra / 2;
    const capW = w + capExtra;
    const capY = isTop ? y + h - capHeight : y;

    const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    capGrad.addColorStop(0, '#1b5e20');
    capGrad.addColorStop(0.2, '#81c784');
    capGrad.addColorStop(0.48, '#c8e6c9');
    capGrad.addColorStop(0.78, '#388e3c');
    capGrad.addColorStop(1, '#1b5e20');

    ctx.fillStyle = capGrad;
    ctx.fillRect(capX, capY, capW, capHeight);
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(capX, capY, capW, capHeight);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    if (isTop) {
      ctx.fillRect(capX, capY + capHeight - 4, capW, 4);
    } else {
      ctx.fillRect(capX, capY, capW, 4);
    }
  }
};

// Background Environment
let groundOffset = 0;

function drawBackground() {
  if (isNightMode) {
    // Night Sky Gradient
    const nightSky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    nightSky.addColorStop(0, '#090d16');
    nightSky.addColorStop(0.55, '#1e1b4b');
    nightSky.addColorStop(1, '#312e81');
    ctx.fillStyle = nightSky;
    ctx.fillRect(0, 0, GAME_WIDTH, GROUND_Y);

    // Twinkling Stars
    stars.forEach(s => {
      const alpha = 0.35 + 0.65 * Math.abs(Math.sin(frames * s.twinkleSpeed + s.phase));
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // Glowing Crescent Moon
    ctx.save();
    const moonX = 330;
    const moonY = 85;
    // Outer Moon Glow
    const moonGlow = ctx.createRadialGradient(moonX, moonY, 12, moonX, moonY, 40);
    moonGlow.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
    moonGlow.addColorStop(1, 'rgba(254, 240, 138, 0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 40, 0, Math.PI * 2);
    ctx.fill();

    // Crescent Moon Shape
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#090d16'; // Shadow cutout
    ctx.beginPath();
    ctx.arc(moonX - 8, moonY - 4, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Night Clouds (Soft moonlit clouds)
    ctx.fillStyle = 'rgba(199, 210, 254, 0.22)';
    const cloudX1 = ((frames * 0.3) % (GAME_WIDTH + 160)) - 80;
    drawCloud(GAME_WIDTH - cloudX1, 105, 38);
    const cloudX2 = ((frames * 0.18 + 200) % (GAME_WIDTH + 200)) - 100;
    drawCloud(GAME_WIDTH - cloudX2, 175, 28);

    // Distant Night Hills
    ctx.fillStyle = '#1e1b4b';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= GAME_WIDTH; x += 40) {
      const hillY = GROUND_Y - 45 + Math.sin((x + frames * 0.3) * 0.02) * 14;
      ctx.lineTo(x, hillY);
    }
    ctx.lineTo(GAME_WIDTH, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    // Foreground Night Hills
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= GAME_WIDTH; x += 30) {
      const hillY = GROUND_Y - 24 + Math.sin((x + frames * 0.6) * 0.035) * 10;
      ctx.lineTo(x, hillY);
    }
    ctx.lineTo(GAME_WIDTH, GROUND_Y);
    ctx.closePath();
    ctx.fill();

  } else {
    // Day Sky Gradient
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#38bdf8');
    sky.addColorStop(0.65, '#bae6fd');
    sky.addColorStop(1, '#e0f2fe');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, GAME_WIDTH, GROUND_Y);

    // Warm Sun
    ctx.save();
    const sunGlow = ctx.createRadialGradient(340, 80, 10, 340, 80, 48);
    sunGlow.addColorStop(0, 'rgba(253, 224, 71, 0.5)');
    sunGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(340, 80, 48, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(340, 80, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Day Clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
    const cloudX1 = ((frames * 0.4) % (GAME_WIDTH + 160)) - 80;
    drawCloud(GAME_WIDTH - cloudX1, 95, 42);
    const cloudX2 = ((frames * 0.25 + 200) % (GAME_WIDTH + 200)) - 100;
    drawCloud(GAME_WIDTH - cloudX2, 160, 32);

    // Distant Hills
    ctx.fillStyle = '#86efac';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= GAME_WIDTH; x += 40) {
      const hillY = GROUND_Y - 45 + Math.sin((x + frames * 0.3) * 0.02) * 14;
      ctx.lineTo(x, hillY);
    }
    ctx.lineTo(GAME_WIDTH, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    // Foreground Hills
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= GAME_WIDTH; x += 30) {
      const hillY = GROUND_Y - 24 + Math.sin((x + frames * 0.6) * 0.035) * 10;
      ctx.lineTo(x, hillY);
    }
    ctx.lineTo(GAME_WIDTH, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCloud(cx, cy, r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.6, cy - r * 0.3, r * 0.75, 0, Math.PI * 2);
  ctx.arc(cx - r * 0.6, cy - r * 0.2, r * 0.65, 0, Math.PI * 2);
  ctx.arc(cx + r * 1.1, cy + r * 0.1, r * 0.55, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  if (gameState !== STATE.GAMEOVER && !isPaused) {
    groundOffset = (groundOffset + 2.35) % 24;
  }

  if (isNightMode) {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, GROUND_Y + 16, GAME_WIDTH, GAME_HEIGHT - GROUND_Y - 16);

    ctx.fillStyle = '#1e3a5f';
    ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 16);

    ctx.fillStyle = '#0f2942';
    ctx.beginPath();
    for (let x = -24; x < GAME_WIDTH + 24; x += 16) {
      const px = x - groundOffset;
      ctx.moveTo(px, GROUND_Y + 16);
      ctx.lineTo(px + 8, GROUND_Y + 4);
      ctx.lineTo(px + 16, GROUND_Y + 16);
    }
    ctx.fill();
  } else {
    ctx.fillStyle = '#dcedc8';
    ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(0, GROUND_Y + 16, GAME_WIDTH, GAME_HEIGHT - GROUND_Y - 16);

    ctx.fillStyle = '#7cb342';
    ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 16);

    ctx.fillStyle = '#558b2f';
    ctx.beginPath();
    for (let x = -24; x < GAME_WIDTH + 24; x += 16) {
      const px = x - groundOffset;
      ctx.moveTo(px, GROUND_Y + 16);
      ctx.lineTo(px + 8, GROUND_Y + 4);
      ctx.lineTo(px + 16, GROUND_Y + 16);
    }
    ctx.fill();
  }
}

function drawScoreHUD() {
  if (gameState !== STATE.PLAYING) return;
  ctx.save();
  ctx.font = '800 48px Pretendard, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = '#0f172a';
  ctx.strokeText(score, GAME_WIDTH / 2, 82);
  ctx.fillText(score, GAME_WIDTH / 2, 82);
  ctx.restore();
}

function triggerGameOver() {
  if (gameState === STATE.GAMEOVER) return;
  gameState = STATE.GAMEOVER;
  sfx.playHit();
  particles.spawn(buddy.x, buddy.y, 20, '#ef4444');

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flappy_buddy_best', bestScore);
  }

  finalScoreEl.innerText = score;
  bestScoreTextEl.innerText = bestScore;

  // Medals calculation
  let medal = '🥉';
  let title = '브론즈 메달';
  if (score >= 40) {
    medal = '💎';
    title = '다이아몬드 마스터!';
  } else if (score >= 25) {
    medal = '🥇';
    title = '골드 메달 달성!';
  } else if (score >= 10) {
    medal = '🥈';
    title = '실버 메달 달성!';
  }
  medalBoxEl.innerText = medal;
  medalTitleEl.innerText = title;

  gameOverOverlay.classList.remove('hidden');
}

function restartGame() {
  sfx.playClick();
  buddy.reset();
  pipes.reset();
  particles.items = [];
  score = 0;
  frames = 0;
  gameState = STATE.PLAYING;
  gameOverOverlay.classList.add('hidden');
  readyOverlay.classList.add('hidden');
  buddy.flap();
}

// User Actions
function handleAction() {
  if (isPaused) return;

  if (gameState === STATE.READY) {
    sfx.init();
    gameState = STATE.PLAYING;
    readyOverlay.classList.add('hidden');
    buddy.flap();
  } else if (gameState === STATE.PLAYING) {
    buddy.flap();
  }
}

// Input Listeners
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameState === STATE.GAMEOVER) {
      restartGame();
    } else {
      handleAction();
    }
  } else if (e.key === 'p' || e.key === 'P') {
    togglePause();
  } else if (e.key === 'm' || e.key === 'M') {
    toggleSound();
  } else if (e.key === 'n' || e.key === 'N') {
    toggleTheme();
  }
});

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  handleAction();
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleAction();
}, { passive: false });

restartBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  restartGame();
});

function toggleTheme() {
  isNightMode = !isNightMode;
  sfx.init();
  sfx.playClick();
  themeBtn.innerText = isNightMode ? '🌙' : '☀️';
}

function togglePause() {
  if (gameState !== STATE.PLAYING && !isPaused) return;
  isPaused = !isPaused;
  sfx.playClick();
  if (isPaused) {
    pauseOverlay.classList.remove('hidden');
    pauseBtn.innerText = '▶';
  } else {
    pauseOverlay.classList.add('hidden');
    pauseBtn.innerText = '❚❚';
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  sfx.init();
  sfx.playClick();
  soundBtn.innerText = soundEnabled ? '🔊' : '🔇';
}

themeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleTheme();
});

pauseBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  togglePause();
});

resumeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  togglePause();
});

soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleSound();
});

// Download Game file feature
downloadBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  sfx.playClick();
  const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'flappy-buddy.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Game Loop
function gameLoop() {
  if (!isPaused) {
    frames++;
    buddy.update();
    pipes.update();
    particles.update();
  }

  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  drawBackground();
  pipes.draw();
  particles.draw();
  buddy.draw();
  drawGround();
  drawScoreHUD();

  requestAnimationFrame(gameLoop);
}

// Start
requestAnimationFrame(gameLoop);
</script>
